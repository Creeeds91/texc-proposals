<!doctype html>
<html lang="en-AU" data-boot="library">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Documents · {{brand.name}} Proposals</title>
<link rel="icon" href="{{brand.logoGold}}" type="image/svg+xml">
<script type="application/json" id="brand-data">{{brand.json}}</script>
<link rel="preload" href="/assets/fonts/Oxanium-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/proposal.css">
<link rel="stylesheet" href="/assets/css/dashboard.css">
<link rel="stylesheet" href="/assets/css/library.css">
<script type="module" src="/assets/js/library.js"></script>
</head>
<body class="db" data-surface="paper">
<a class="skip" href="#db-main">Skip to the documents</a>
<header class="db-top">
  <div class="db-top-inner">
    <a class="db-brand" href="/dashboard"><img src="{{brand.logoGold}}" alt="{{brand.name}}" width="72" height="28"><span>Proposals</span></a>
    <nav class="db-nav" aria-label="Staff">
      <a href="/dashboard">Dashboard</a>
      <a href="/documents" aria-current="page">Documents</a>
      <a href="/editor" data-role="editor" hidden>Editor</a>
      <a href="/editor#people" data-role="admin" hidden>People</a>
    </nav>
    <div class="db-who"><span id="db-who"></span><button type="button" class="db-signout" id="db-signout">Sign out</button></div>
  </div>
</header>

<main id="db-main" class="db-main" tabindex="-1">
  <div class="db-head">
    <div>
      <h1 class="db-title">Documents</h1>
      <p class="db-sub">Standing documents, uploaded once and offered on any proposal: the company’s, and each person’s.</p>
    </div>
    <button type="button" class="btn btn--primary btn--sm" id="lib-add" data-role="admin" hidden><svg class="ic" aria-hidden="true"><use href="/assets/img/icons.svg#plus"></use></svg><span>Add a document</span></button>
  </div>

  <p class="db-loading" id="db-loading" role="status">Loading…</p>
  <p class="db-error" id="db-error" role="alert" hidden></p>

  <section class="db-card lib-attention" aria-labelledby="lib-attention-h" hidden>
    <div class="db-card-head">
      <h2 class="db-h3" id="lib-attention-h">Needs attention</h2>
      <span class="db-count" id="lib-attention-count"></span>
    </div>
    <ol class="db-follow-list" id="lib-attention-list"></ol>
  </section>

  <section class="db-list lib-list" aria-labelledby="lib-list-h" hidden>
    <div class="db-section-head">
      <h2 class="db-h2" id="lib-list-h">The library</h2>
      <p class="db-count" id="lib-count" role="status" aria-live="polite"></p>
    </div>
    <form class="db-filters" id="lib-filters" role="search">
      <label class="db-control db-control--search"><span class="db-control-label">Search</span>
        <span class="db-search"><svg class="ic" aria-hidden="true"><use href="/assets/img/icons.svg#search"></use></svg><input type="search" id="f-q" placeholder="Title, issuer, number, code" autocomplete="off" maxlength="200"></span>
      </label>
      <label class="db-control"><span class="db-control-label">Whose</span><select id="f-owner"></select></label>
      <label class="db-control"><span class="db-control-label">Kind</span><select id="f-kind"></select></label>
      <label class="db-control"><span class="db-control-label">Showing</span><select id="f-show"></select></label>
    </form>
    <div id="lib-groups"></div>
    <p class="db-empty" id="lib-empty" hidden></p>
  </section>
</main>

<dialog class="db-panel" id="db-panel" aria-labelledby="db-panel-title"></dialog>
<div class="db-toast" id="db-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
